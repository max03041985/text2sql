[project]
name = "bfsi-text-to-sql"
version = "1.0.0"
description = "BFSI Marketing & Operations Analytics - Text-to-SQL Engine"
requires-python = ">=3.11, <3.14"
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.1.19",
    "httpx==0.27.0",
    "sqlglot==23.3.0",
    "pandas==2.2.2",
    "streamlit==1.35.0",
    "plotly==5.22.0",
    "python-multipart==0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ui"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]